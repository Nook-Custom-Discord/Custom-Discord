name: Build & Release

# Release entsteht durch einen Versions-Tag (git tag v1.3.0 && git push --tags)
# oder per Hand unter Actions → „Build & Release“ → Run workflow: dann wird der Tag
# aus der Version in package.json selbst angelegt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: nook-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg

  # ein gemeinsamer Release für beide Systeme (erst wenn beide Builds fertig sind)
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nook ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: |
            dist/*.exe
            dist/*.dmg
